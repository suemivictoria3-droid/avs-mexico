<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="format-detection" content="telephone=no">
<title>Análisis de Vulnerabilidad de Seguridad Física — Sigma</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{--red:#D50032;--red2:#9D2235;--yellow:#FFC72C;--green:#7A9A01;--orange:#E04E39;--lorange:#EF9600;--bg:#F4F5F7;--white:#fff;--border:#E1E4E8;--borderl:#F0F2F4;--txt:#1C1C2E;--mid:#374151;--mut:#64748B;--dim:#94A3B8}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--txt);font-size:14px}
button,input,textarea,select{font-family:Arial,Helvetica,sans-serif}
::-webkit-scrollbar{width:5px;height:5px}::-webkit-scrollbar-thumb{background:#CBD5E1;border-radius:3px}
.app{display:flex;height:100vh;height:100dvh;overflow:hidden}
.sidebar{width:240px;flex-shrink:0;background:#fff;border-right:1px solid var(--border);display:flex;flex-direction:column;height:100%;overflow-y:auto;transition:width .25s}
.sidebar.collapsed{width:0;min-width:0;overflow:hidden;border:none}
.sb-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:150}
.main-view{flex:1;min-width:0;display:flex;flex-direction:column;overflow:hidden}
.top-bar{background:#fff;border-bottom:1px solid var(--border);z-index:100;box-shadow:0 2px 8px rgba(0,0,0,.06);flex-shrink:0}
.top-bar-stripe{height:4px;background:linear-gradient(90deg,var(--red2),var(--red),var(--yellow))}
.top-bar-inner{padding:12px 20px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;background:var(--bg);padding:18px 22px 80px}
.card{background:#fff;border-radius:8px;border:1px solid var(--border);padding:16px}
.form-label{font-size:11px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.5px;display:block;margin-bottom:5px}
.form-input,.form-select,.form-textarea{width:100%;padding:10px 12px;border:1.5px solid var(--border);border-radius:6px;font-size:14px;color:var(--txt);background:#fff;outline:none;-webkit-appearance:none;appearance:none}
.form-textarea{resize:vertical;min-height:60px;font-size:13px}
.form-input:focus,.form-select:focus,.form-textarea:focus{border-color:var(--red)}
.form-group{margin-bottom:14px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.btn{padding:9px 16px;border-radius:6px;border:none;font-size:13px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:6px;text-decoration:none;white-space:nowrap;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.btn:disabled{opacity:.45;cursor:default}
.btn-red{background:var(--red);color:#fff}.btn-green{background:var(--green);color:#fff}
.btn-outline{background:#fff;color:var(--mid);border:1px solid var(--border)}
.btn-sm{padding:7px 12px;font-size:12px}
.badge{padding:3px 10px;border-radius:4px;font-size:11px;font-weight:700;display:inline-block}
.tag{color:#fff;padding:2px 8px;border-radius:3px;font-size:10px;font-weight:700;display:inline-block}
.tabs{display:flex;border-bottom:1px solid var(--border);background:#fff;overflow-x:auto;-webkit-overflow-scrolling:touch}
.tab{padding:9px 14px;border:none;background:none;border-bottom:3px solid transparent;color:var(--mut);font-size:12px;cursor:pointer;white-space:nowrap}
.tab.active{color:var(--red);border-bottom-color:var(--red);font-weight:700}
.kpi{background:#fff;border-radius:7px;padding:14px 16px;border:1px solid var(--border);border-left:4px solid var(--border);flex:1;min-width:120px}
.kpi-val{font-size:24px;font-weight:700;line-height:1;margin:5px 0 2px}
.kpi-lbl{font-size:10px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.7px}
.kpi-sub{font-size:10px;color:var(--dim);margin-top:2px}
.foto-grid{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.foto-thumb{position:relative;width:76px;height:76px}
.foto-thumb img{width:100%;height:100%;object-fit:cover;border-radius:6px;border:1px solid var(--border);display:block}
.foto-del{position:absolute;top:-6px;right:-6px;width:22px;height:22px;border-radius:50%;background:var(--red);color:#fff;border:none;font-size:13px;font-weight:700;cursor:pointer}
.acceso-card{border:1px solid var(--border);border-radius:8px;margin-bottom:12px;overflow:hidden;background:#fff}
.acceso-header{padding:8px 12px;background:#FAFBFC;border-bottom:1px solid var(--borderl);border-left:4px solid var(--red)}
.acceso-body{padding:12px}
.ac-wrap{position:relative}
.ac-list{position:absolute;z-index:200;background:#fff;border:1px solid var(--border);border-radius:6px;box-shadow:0 4px 16px rgba(0,0,0,.12);max-height:240px;overflow-y:auto;width:100%;top:calc(100% + 4px);left:0}
.ac-item{padding:9px 12px;cursor:pointer;font-size:13px;border-bottom:1px solid var(--borderl)}
.ac-item:hover{background:#F8FAFC;color:var(--red)}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:10001;display:flex;align-items:center;justify-content:center;padding:16px}
.pin-box{background:#fff;border-radius:12px;padding:28px;width:320px;max-width:100%;text-align:center;box-shadow:0 8px 32px rgba(0,0,0,.2);border-top:4px solid var(--red)}
.sb-nav{width:100%;display:flex;align-items:center;gap:8px;padding:9px 10px;border-radius:6px;border:none;background:transparent;color:var(--mut);font-size:13px;cursor:pointer;text-align:left;margin-bottom:2px}
.sb-nav.active{background:#F9E4E8;color:var(--red);font-weight:700}
.sb-rec{width:100%;display:flex;align-items:center;gap:7px;padding:7px 10px;border-radius:5px;border:none;background:transparent;cursor:pointer;text-align:left}
.sb-rec:hover{background:#F8FAFC}
.toast{position:fixed;bottom:84px;left:50%;transform:translateX(-50%);color:#fff;padding:10px 18px;border-radius:20px;font-size:13px;font-weight:700;z-index:10002;box-shadow:0 4px 14px rgba(0,0,0,.2);max-width:90vw;text-align:center}
.navb{background:#fff;border-top:1px solid var(--border);padding:10px 16px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-shrink:0}
table.tb{width:100%;border-collapse:collapse;font-size:12px}
table.tb th{padding:8px 10px;text-align:left;color:var(--mut);font-size:10px;text-transform:uppercase;border-bottom:2px solid var(--border);background:#FAFBFC;white-space:nowrap}
table.tb td{padding:9px 10px;border-bottom:1px solid var(--borderl)}
.map-frame{width:100%;height:270px;border:0;display:block}
/* ===== PDF ===== */
#pdf-overlay{position:fixed;inset:0;z-index:9999;background:#E9ECEF;display:flex;flex-direction:column}
#pdf-bar{background:var(--red);color:#fff;padding:10px 14px;display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;flex-shrink:0}
#pdf-bar .btn{background:#fff;color:var(--red)}
#pdf-bar .btn.ghost{background:rgba(255,255,255,.15);color:#fff;border:1.5px solid rgba(255,255,255,.6)}
#pdf-tip{background:#FFF8DC;color:#5b4500;font-size:12px;padding:8px 14px;border-bottom:1px solid #f0d98a;flex-shrink:0}
#pdf-scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px}
#pdf-page{max-width:820px;margin:0 auto;background:#fff;padding:26px;box-shadow:0 2px 12px rgba(0,0,0,.1)}
@media(max-width:640px){
  .sidebar{display:none}
  .sidebar.mobile-open{display:flex;position:fixed;z-index:200;left:0;top:0;height:100%;width:260px}
  .top-bar-inner{padding:10px 12px}
  .scroll{padding:12px 10px 80px}
  .card{padding:12px}
  .g2{grid-template-columns:1fr}
  .form-input,.form-select,.form-textarea{font-size:16px}
  #pdf-page{padding:14px}
  #pdf-scroll{padding:6px}
  .hide-m{display:none!important}
}
@media print{
  @page{size:letter;margin:12mm}
  html,body{height:auto!important;background:#fff!important;overflow:visible!important}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  body.print-mode #app,body.print-mode .toast,body.print-mode .overlay{display:none!important}
  #pdf-bar,#pdf-tip{display:none!important}
  #pdf-overlay{position:static!important;display:block!important;background:#fff!important}
  #pdf-scroll{overflow:visible!important;padding:0!important}
  #pdf-page{max-width:none!important;padding:0!important;box-shadow:none!important}
}
</style>
</head>

const PTS_SEL={"Block o ladrillo":10,"Mixto":8,"Cerca tubular":7,"Alambre electrosoldado":6,"Malla ciclónica":5,"Automático":10,"Semiautomático":6,"Manual":2,"Mayor a 3.5m":10,"3.5m":7,"Menor a 3.5m":3};
const PTS_SEL3={completo:10,bueno:10,parcial:5,regular:5,sin_barda:0,malo:0};
function matchKeys(ev,base){const re=new RegExp("^"+base+"(_\\d+)?$");return Object.keys(ev||{}).filter(k=>re.test(k)).sort();}
function isBrecha(q,v){return (q.tipo==="yn"&&v==="no")||(q.tipo==="sel3"&&["parcial","malo","sin_barda"].includes(v))||(q.tipo==="sel"&&["Manual","Menor a 3.5m","Malla ciclónica"].includes(v));}
function calcSec(key,ev){
 const qs=REACTIVOS[key];if(!qs)return null;let t=0,m=0;
 qs.forEach(q=>matchKeys(ev,q.k).forEach(k=>{const v=ev[k];if(v===undefined||v===null||v==="")return;
  if(q.tipo==="yn"){m+=10;t+=v==="si"?10:0;}else if(q.tipo==="sel3"){m+=10;t+=PTS_SEL3[v]||0;}else if(q.tipo==="sel"){m+=10;t+=PTS_SEL[v]||0;}}));
 return m===0?null:Math.round(t/m*100);}
function calcAll(ev){let ws=0,tot=0;SECCIONES.forEach(s=>{if(!s.peso)return;const sc=calcSec(s.key,ev);if(sc!==null){tot+=sc*s.peso;ws+=s.peso;}});return ws===0?null:Math.round(tot/ws);}
function viab(s){if(s===null||s===undefined)return null;return s>=80?"Viable":s>=60?"Viable condicionado":"No viable";}
function accSuffix(rec,secKey,k,base){
 if(secKey!=="acc_peatonal"&&secKey!=="acc_vehicular"||k===base)return"";
 const i=parseInt(k.slice(base.length+1));const arr=secKey==="acc_peatonal"?rec.accesos_peat:rec.accesos_veh;
 return " — "+((arr&&arr[i]&&arr[i].nombre)||("Acceso "+(i+1)));}
const REC_LABELS={criminologico:"Contexto criminológico y riesgo estatal"};SECCIONES.forEach(s=>REC_LABELS[s.key]=s.label);
function genRecs(rec){
 const ev=rec.ev||{},notas=rec.notas||{},pan=getPanorama(rec.estado),cors=getCorredores(rec.estado);const out={criminologico:[]};
 if(pan){
  if(pan.se>=4)out.criminologico.push({h:null,r:`Estado ${rec.estado} — Nivel ${pan.nivel} (${pan.se}/5): ${pan.exp}. Elevar barreras físicas y tecnológicas al nivel máximo.`});
  if(pan.balam)out.criminologico.push({h:null,r:"Estrategia Balam (GN) activa por robo a transportista. Implementar GPS en unidades, alertas de ruta y protocolos de recepción nocturna de tráiler."});
  cors.filter(c=>c.sc>=4).slice(0,2).forEach(c=>out.criminologico.push({h:null,r:`Corredor ${c.c} (${c.t}) — "${c.nv}": ${c.hll}. Activar protocolo de ruta segura antes de despachos.`}));
 }else if(rec.estado)out.criminologico.push({h:null,r:"Validar incidencia municipal mediante SESNSP y plataforma Aleph para ajustar el nivel de riesgo del sitio."});
 SECCIONES.forEach(s=>{const qs=REACTIVOS[s.key];if(!qs)return;const list=[];
  qs.forEach(q=>matchKeys(ev,q.k).forEach(k=>{if(isBrecha(q,ev[k]))list.push({h:q.label+accSuffix(rec,s.key,k,q.k),r:(notas[k+"_rec"]||q.rec),k});}));
  out[s.key]=list;});
 return out;}
function genConcl(rec){
 const s=calcAll(rec.ev||{}),z=getZona(s),v=viab(s);if(s===null)return"Sin datos suficientes para generar conclusión.";
 const pan=getPanorama(rec.estado),cors=getCorredores(rec.estado),recs=genRecs(rec);
 const cnt=keys=>keys.reduce((a,k)=>a+(recs[k]||[]).length,0);
 const total=Object.keys(recs).filter(k=>k!=="criminologico").reduce((a,k)=>a+recs[k].length,0);
 const bF=cnt(["perimetro","caseta","acc_peatonal","acc_vehicular"]),bT=cnt(["cctv","alarmas"]),bO=cnt(["gara","recer","operaciones","emergencias"]);
 const ct=cors.filter(c=>c.sc>=4)[0];let ctx="";
 if(pan)ctx=`\n\nContexto territorial (${rec.estado}): nivel de riesgo ${pan.nivel} (score ${pan.se}/5). ${pan.exp}.${pan.balam?" Estrategia Balam (GN) activa.":""}${ct?` Corredor ${ct.c} (${ct.t}) — "${ct.nv}".`:""}`;
 return `La instalación ${rec.nombre_sitio||""} (${rec.municipio||""}${rec.estado?", "+rec.estado:""}) obtuvo un score general de ${s}/100, clasificación Zona ${z} (${zdOf(s).cond}). Se identificaron ${total} brechas: ${bF} de infraestructura física y accesos, ${bT} de tecnología y ${bO} de protocolos y procesos.${ctx}\n\n${s<60?"Las brechas incrementan significativamente la probabilidad de riesgos patrimoniales (intrusión, robo de unidades/carga, agresión). Se requiere atención inmediata.":"Las condiciones son funcionales con oportunidades de mejora para alcanzar los estándares PPES-001."}\n\nDictamen: ${v}${pan&&pan.se>=4?" (reforzado por nivel de riesgo estatal Crítico — SESNSP 2026)":""}.\n\nFuente: SESNSP/Presidencia, GN Balam, Aleph — Corte 2026. Metodología: PPES-001, PIS Sigma, GARA/RECER.`;}
